name: fsscore-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - scipy
  - scikit-learn
  - pytorch
  - pytorch-lightning
  - torch-geometric
  - rdkit
  - pip:
    - git+https://github.com/schwallergroup/fsscore.git@main
    # run_cv_pipeline.py runs in this env and needs these; installed via pip so the
    # conda pytorch/torch-geometric solve above is left untouched.
    - optuna
    - xgboost